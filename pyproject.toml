[project]
name = "phishguard"
version = "0.1.0"
description = "Anti-phishing email agent with hard read/write isolation and an MFA gateway"
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.5", "anthropic>=0.40", "pyotp>=2.9"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"examples/*" = ["E501"]
"scripts/*" = ["E501"]
"phishguard/dataset/generator.py" = ["E501"]
"phishguard/readonly/features.py" = ["E501"]
